services:
  envoy:
    image: envoyproxy/envoy:v1.33-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10000:10000"
      - "9901:9901"
    depends_on:
      - delayed_service

  delayed_service:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3000:3000"
